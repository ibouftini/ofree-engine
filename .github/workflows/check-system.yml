name: Check · system programs without apt

# Programs from the package manager, restored from the cached snapshot: the
# programs sample built twice in a row, on each kind of runner.

on:
  workflow_dispatch:

jobs:
  first:
    name: first · ${{ matrix.where }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { where: ubuntu, os: ubuntu-latest, container: "" }
          - { where: ubuntu-24, os: ubuntu-24.04, container: "" }
          - { where: macos, os: macos-latest, container: "" }
          - { where: root-container, os: ubuntu-latest, container: "ubuntu:24.04" }
    steps:
      - if: matrix.container != ''
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates perl xz-utils wget fontconfig zstd >/dev/null
      - uses: actions/checkout@v5
      - uses: ./
        with:
          working_directory: bench/samples/programs
          artifact_name: first-${{ matrix.where }}

  second:
    name: second · ${{ matrix.where }}
    needs: first
    if: always()
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { where: ubuntu, os: ubuntu-latest, container: "" }
          - { where: ubuntu-24, os: ubuntu-24.04, container: "" }
          - { where: macos, os: macos-latest, container: "" }
          - { where: root-container, os: ubuntu-latest, container: "ubuntu:24.04" }
    steps:
      - if: matrix.container != ''
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates perl xz-utils wget fontconfig zstd >/dev/null
      - uses: actions/checkout@v5
      - uses: ./
        with:
          working_directory: bench/samples/programs
          artifact_name: second-${{ matrix.where }}
