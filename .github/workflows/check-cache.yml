name: Check · cache contents

# What the cached TeX Live holds, and how big each part is once compressed
# the way @actions/cache compresses it (tar + zstd).

on:
  workflow_dispatch:

jobs:
  inspect:
    name: inspect · ${{ matrix.doc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        doc: [paper, lua]
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        with:
          working_directory: bench/samples/${{ matrix.doc }}
          cache: false
          upload: false
      - name: Sizes
        run: |
          cd ~/.ofree/texlive
          {
            echo "### ${{ matrix.doc }}"
            echo '```'
            echo "files: $(find . -type f | wc -l)"
            echo "whole tree compressed (zstd -3): $(tar -cf - . | zstd -T0 -3 -q | wc -c | numfmt --to=iec)"
            echo "--- uncompressed, largest folders (depth 3)"
            du -h --max-depth=3 . | sort -rh | head -25
            echo "--- each top folder compressed"
            for d in $(find . -mindepth 1 -maxdepth 2 -type d); do printf '%8s  %s\n' "$(tar -cf - "$d" | zstd -T0 -3 -q | wc -c | numfmt --to=iec)" "$d"; done | sort -rh | head -20
            echo "--- largest files"
            find . -type f -printf '%s %p\n' | sort -rn | head -20 | numfmt --to=iec --field=1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  keep-warm:
    name: keep_warm · paper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        with:
          working_directory: bench/samples/paper
          keep_warm: true
      - name: Nothing was compiled
        run: test ! -e bench/samples/paper/main.pdf

  update:
    name: update · outdated cached packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        with:
          working_directory: bench/samples/paper
          cache: false
          upload: false
      - name: Make one installed package look outdated
        run: |
          db=~/.ofree/texlive/tlpkg/texlive.tlpdb
          perl -0pi -e 's/(\nname booktabs\n(?:[^\n]+\n)*?revision )\d+/${1}1/' "$db"
          grep -A3 "^name booktabs$" "$db" | grep revision
      - name: A document that asks for a newer LaTeX, with an error
        run: |
          mkdir -p /tmp/upd && cd /tmp/upd
          printf '%s\n' '\NeedsTeXFormat{LaTeX2e}[2099-01-01]' '\documentclass{article}' '\usepackage{booktabs}' '\begin{document}' 'Some text.' '\undefinedcommand' '\end{document}' > main.tex
          cp -r /tmp/upd "$GITHUB_WORKSPACE/upd"
      - uses: ./
        with:
          working_directory: upd
          cache: false
          upload: false
          on_error: warn

  kanji:
    name: kanji maps on a first install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        continue-on-error: true
        with:
          working_directory: test/fixtures/japanese-class
          cache: false
          upload: false
      - name: State of the maps
        run: |
          set +e
          T=~/.ofree/texlive; export PATH=$T/bin/x86_64-linux:$PATH
          cd test/fixtures/japanese-class
          echo "--- which"; which dvipdfmx xdvipdfmx; ls -la $T/bin/x86_64-linux/dvipdfmx
          echo "--- cfg"; C=$(kpsewhich -progname=dvipdfmx -format='other text files' dvipdfmx.cfg); echo "cfg=$C"; grep -n -E '^ *f ' "$C"
          echo "--- kpse map"; kpsewhich -progname=dvipdfmx -format=map kanjix.map; kpsewhich -progname=dvipdfmx -format=map pdftex.map
          echo "--- kanjix head"; grep -n 'uprml-h\|upgbm-h' $T/texmf-var/fonts/map/dvipdfmx/updmap/kanjix.map; head -3 $T/texmf-var/fonts/map/dvipdfmx/updmap/kanjix.map
          echo "--- fonts"; kpsewhich HaranoAjiMincho-Regular.otf; kpsewhich -format=opentype HaranoAjiMincho-Regular.otf; kpsewhich uprml-h.tfm; kpsewhich -format=vf uprml-h.vf
          echo "--- compile as is"; uplatex -interaction=nonstopmode report.tex >/dev/null; ls -la report.dvi; dvipdfmx -vv report.dvi 2>&1 | grep -E -i "map|fatal|uprml|config|Could not" | head -20
          echo "--- updmap again"; updmap-sys 2>&1 | grep -E -i "kanji|error|warn|Generating|Output" | head -15
          echo "--- compile after updmap"; dvipdfmx -vv report.dvi 2>&1 | grep -E -i "fatal|Could not|Output" | head; ls -la report.pdf
          exit 0
