name: Spike · provisioning

on:
  workflow_dispatch:

env:
  ROOTS: scheme-basic,latexmk,biblatex,biber,booktabs,siunitx
  SAMPLE: bench/samples/paper

jobs:
  incumbent:
    name: xu-cheng/latex-action@v4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: echo "T0=$(date +%s.%N)" >> "$GITHUB_ENV"
      - uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: ${{ env.SAMPLE }}
      - name: Record time
        run: |
          s=$(python3 -c "print(f'{$(date +%s.%N) - $T0:.1f}')")
          printf '### Incumbent\n\n| Phase | Seconds |\n|---|---:|\n| xu-cheng/latex-action step (pull + compile) | %s |\n' "$s" >> "$GITHUB_STEP_SUMMARY"
          test -f "$SAMPLE/main.pdf"

  cold-parallel:
    name: Cold · parallel prefetch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash tools/spike-provision.sh parallel "$ROOTS" "$SAMPLE"
      - uses: actions/cache/save@v4
        with:
          path: ~/.ofree/texlive
          key: spike-tl-${{ runner.os }}-${{ hashFiles('tools/closure.py', 'tools/spike-provision.sh') }}-${{ github.run_id }}

  cold-sequential:
    name: Cold · sequential (old way)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash tools/spike-provision.sh sequential "$ROOTS" "$SAMPLE"

  warm:
    name: Warm · cache restore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: echo "T0=$(date +%s.%N)" >> "$GITHUB_ENV"
      - id: restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.ofree/texlive
          key: spike-tl-${{ runner.os }}-${{ hashFiles('tools/closure.py', 'tools/spike-provision.sh') }}-none
          restore-keys: spike-tl-${{ runner.os }}-${{ hashFiles('tools/closure.py', 'tools/spike-provision.sh') }}-
      - name: Compile from restored cache
        run: |
          if [[ -z "${{ steps.restore.outputs.cache-matched-key }}" ]]; then
            echo "### Warm" >> "$GITHUB_STEP_SUMMARY"
            echo "No cache from an earlier run yet; dispatch this workflow again to measure warm runs." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          t1=$(date +%s.%N)
          export PATH="$HOME/.ofree/texlive/bin/x86_64-linux:$PATH"
          (cd "$SAMPLE" && latexmk -pdf -interaction=nonstopmode -file-line-error main.tex > /tmp/latexmk.log 2>&1) || { tail -60 /tmp/latexmk.log; exit 1; }
          t2=$(date +%s.%N)
          python3 - "$T0" "$t1" "$t2" "$(du -sm ~/.ofree/texlive | cut -f1)" >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import sys
          t0, t1, t2, mb = map(float, sys.argv[1:])
          print("### Warm\n\n| Phase | Seconds |\n|---|---:|")
          print(f"| restore TeX Live from cache ({mb:.0f} MiB on disk) | {t1 - t0:.1f} |")
          print(f"| compile sample (latexmk, biber) | {t2 - t1:.1f} |")
          print(f"| TOTAL | {t2 - t0:.1f} |")
          EOF
