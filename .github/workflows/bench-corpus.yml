  incumbent-cao-wuhui-szu-latex-master-template:
    name: incumbent · cao-wuhui-szu-latex-master-template
    if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), ',cao-wuhui-szu-latex-master-template,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Cao-Wuhui/SZU_Latex_Master_Template
          ref: 79c3ba378a933be2427d0787638458f9a45bce2d
          submodules: recursive
      - uses: xu-cheng/latex-action@v4
        with:
          root_file: "master_pang.tex"
          latexmk_use_xelatex: "true"
          extra_system_packages: "font-noto-cjk font-dejavu fontconfig curl cabextract"
          extra_fonts: |
            ./simsun.ttc
            ./songti-Bold.otf
            ./lucida-console.ttf
          pre_compile: |
            # The footnote code in master_pang.tex checks fonts in order:
            #   Noto Sans Symbols 2 → Segoe UI Symbol → Symbola → Arial Unicode MS → DejaVu Sans
            # Noto Sans Symbols 2 doesn't contain ①②③ (U+2460), and Symbola has
            # stale TeX Live references that trick \IfFontExistsTF but fail to load.
            # Remove both so the chain reaches DejaVu Sans, which has ①-⑳.
            find /usr/share/fonts -name '*Symbols2*' -delete 2>/dev/null || true
            find /opt/texlive -name '*Symbols2*' -delete 2>/dev/null || true
            find /opt/texlive -name '*ymbola*' -delete 2>/dev/null || true
            
            # Download and install Microsoft core fonts (Times New Roman, Arial)
            (
              mkdir -p /tmp/msfonts && cd /tmp/msfonts
              curl -sLO "https://sourceforge.net/projects/corefonts/files/the%20fonts/final/arial32.exe"
              curl -sLO "https://sourceforge.net/projects/corefonts/files/the%20fonts/final/times32.exe"
              cabextract -q *.exe
              mkdir -p /usr/share/fonts/msttcorefonts
              find . -iname '*.ttf' -exec cp {} /usr/share/fonts/msttcorefonts/ \;
            )
            
            # SimHei is not available in standard Linux font repos;
            # map it to Noto Sans CJK SC via fontconfig alias.
            # To use the real SimHei, add simhei.ttf to the repo and extra_fonts list.
            cat > /etc/fonts/conf.d/99-simhei-alias.conf << 'FONTCFG'
            <?xml version="1.0"?>
            <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
            <fontconfig>
              <alias>
                <family>SimHei</family>
                <prefer><family>Noto Sans CJK SC</family></prefer>
              </alias>
            </fontconfig>
            FONTCFG
            
            fc-cache -fv

