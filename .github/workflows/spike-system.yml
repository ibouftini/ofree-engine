name: Spike · system programs without apt

# Can programs from apt be restored from a snapshot of the files they added?
# One job installs with apt, measures it and saves the snapshot; another, on a
# clean runner, restores the snapshot and uses the programs for real.

on:
  workflow_dispatch:
  push:
    branches: [edge-cases]
    paths: [".github/workflows/spike-system.yml"]

jobs:
  first:
    name: first · ${{ matrix.where }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { where: ubuntu, os: ubuntu-latest, container: "" }
          - { where: macos, os: macos-latest, container: "" }
          - { where: root-container, os: ubuntu-latest, container: "ubuntu:24.04" }
    steps:
      - if: matrix.container != ''
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates perl xz-utils wget fontconfig zstd >/dev/null
      - uses: actions/checkout@v5
      - uses: ./
        with:
          working_directory: bench/samples/programs
          artifact_name: first-${{ matrix.where }}

  second:
    name: second · ${{ matrix.where }}
    needs: first
    if: always()
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { where: ubuntu, os: ubuntu-latest, container: "" }
          - { where: macos, os: macos-latest, container: "" }
          - { where: root-container, os: ubuntu-latest, container: "ubuntu:24.04" }
    steps:
      - if: matrix.container != ''
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates perl xz-utils wget fontconfig zstd >/dev/null
      - uses: actions/checkout@v5
      - uses: ./
        with:
          working_directory: bench/samples/programs
          artifact_name: second-${{ matrix.where }}
